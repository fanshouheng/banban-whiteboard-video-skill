<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banban 白板视频</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="studio">
      <header class="toolbar">
        <div>
          <p class="project-name">AI 博主首条视频 · 白板讲课版</p>
          <p class="project-state">画面由 ChatCut 剪辑时间戳驱动</p>
        </div>
        <div class="transport" aria-label="播放控制">
          <button id="playButton" type="button">播放</button>
          <button id="pauseButton" type="button">暂停</button>
          <button id="replayButton" type="button">重播</button>
          <input id="timeline" type="range" min="0" max="13158" step="1" value="0" aria-label="视频时间" />
          <output id="timecode" for="timeline">00:00 / 07:19</output>
        </div>
      </header>

      <div id="stageShell" class="stage-shell">
        <section id="stage" class="stage" aria-label="白板视频画面">
          <img class="board-background" src="assets/whiteboard-bg.png" alt="略带侧视角的真实白板" />
          <div id="boardPlane" class="board-plane">
            <header class="board-header">
              <span id="sceneNumber" class="scene-number"></span>
              <h1 id="sceneTitle"></h1>
              <div class="title-rule"></div>
            </header>
            <div id="sceneContent" class="scene-content"></div>
            <svg id="annotationLayer" class="annotation-layer" viewBox="0 0 1000 600" aria-hidden="true"></svg>
            <img id="drawingTeacher" class="drawing-teacher" src="assets/teacher-doodle.svg" alt="" />
            <p class="board-signature">AI 开发真实记录 · 白板讲课</p>
          </div>
        </section>
      </div>
      <audio id="voiceover" preload="auto" src="output/voiceover.mp3"></audio>
    </main>
    <script src="app.js"></script>
  </body>
</html>
